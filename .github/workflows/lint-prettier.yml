name: Lint & Prettier
on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Run lint & format check
        id: checks
        continue-on-error: true
        run: |
          cd shared
          npm run lint
          npm run format:check

      - name: Comment on PR if checks failed
        if: steps.checks.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ Lint & Prettier check failed',
                '',
                'Please fix the issues locally by running the following commands inside the `shared` package:',
                '',
                '```bash',
                'cd shared',
                'npm run lint',
                'npm run format',
                '```',
                '',
                'Then commit and push the changes.',
              ].join('\n'),
            });

      - name: Fail the job if checks failed
        if: steps.checks.outcome == 'failure'
        run: exit 1